[package]
name = "ninectl"
description = "Controller-9 headless host and simulated controller"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "controller9"
path = "src/main.rs"

# Legacy name kept for existing scripts and docs (identical binary).
[[bin]]
name = "ninectl"
path = "src/bin/ninectl.rs"

[features]
default = ["ble"]
# Bluetooth LE GATT link (SPEC §8.3). Linux builds need libdbus-1-dev.
ble = ["nine-host-core/ble"]

[dependencies]
nine-host-core.workspace = true
nine-proto.workspace = true
tokio = { workspace = true, features = ["signal"] }
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
qrcode.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nine-pad-linux.workspace = true
[target.'cfg(target_os = "macos")'.dependencies]
nine-pad-macos.workspace = true
[target.'cfg(windows)'.dependencies]
nine-pad-windows.workspace = true
