[package]
name = "ninectl"
description = "9-controller headless host and simulated controller"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ninectl"
path = "src/main.rs"

[dependencies]
nine-host-core.workspace = true
nine-proto.workspace = true
tokio = { workspace = true, features = ["signal"] }
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
qrcode.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nine-pad-linux.workspace = true
[target.'cfg(target_os = "macos")'.dependencies]
nine-pad-macos.workspace = true
[target.'cfg(windows)'.dependencies]
nine-pad-windows.workspace = true
