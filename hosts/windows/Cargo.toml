[package]
name = "nine-pad-windows"
description = "Controller-9 Windows backend: client for the NineVhf KMDF virtual-HID driver"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nine-devnode"
path = "src/bin/nine_devnode.rs"

[dependencies]
nine-host-core.workspace = true
nine-proto.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Devices_DeviceAndDriverInstallation"] }
