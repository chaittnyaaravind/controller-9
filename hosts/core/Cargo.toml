[package]
name = "nine-host-core"
description = "Controller-9 desktop host core: sessions, pairing, slots, diagnostics, backend interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nine-proto.workspace = true
tokio.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
thiserror.workspace = true
tracing.workspace = true
mdns-sd.workspace = true
directories.workspace = true
qrcode.workspace = true
if-addrs = "=0.15.0"
# Already in the tree via tokio; used only to mark input/feedback datagrams as Expedited Forwarding.
socket2 = "=0.6.5"
btleplug = { version = "=0.13.5", optional = true }
uuid = { version = "=1.28.0", optional = true }
futures = { version = "=0.3.34", optional = true }

[features]
default = []
# BLE GATT central (SPEC §8.3). Linux builds need libdbus-1-dev (BlueZ over D-Bus).
ble = ["dep:btleplug", "dep:uuid", "dep:futures"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
