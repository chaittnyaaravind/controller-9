[package]
name = "ninecontroller-app"
description = "Controller-9 desktop companion (macOS, Windows, Linux)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ninecontroller_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[features]
default = ["ble"]
# Bluetooth LE GATT link (SPEC §8.3). Linux builds need libdbus-1-dev.
ble = ["nine-host-core/ble"]

[dependencies]
tauri = { version = "=2.12.4", features = [] }
nine-host-core.workspace = true
nine-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nine-pad-linux.workspace = true
[target.'cfg(target_os = "macos")'.dependencies]
nine-pad-macos.workspace = true
[target.'cfg(windows)'.dependencies]
nine-pad-windows.workspace = true
