# XcodeGen spec. Generate the project:  cd apps/ios && xcodegen generate
name: Controller9
options:
  bundleIdPrefix: dev.ninecontroller
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
packages:
  NineAppCore: { path: Core }
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "5"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""          # set your Apple team ID (see docs/BUILD.md)
targets:
  Controller9:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../../protocol/profiles
        type: folder              # bundled as "profiles/*.json" (shared presets)
        buildPhase: resources
    dependencies:
      - package: NineAppCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Controller-9
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: { UIColorName: "" }
        UIRequiresFullScreen: true
        UIAppFonts: [Geist.ttf, GeistMono.ttf]
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: "Scan the pairing code shown on your computer."
        NSLocalNetworkUsageDescription: "Find and connect to Controller-9 on computers on your Wi-Fi network."
        NSBonjourServices: [_ninectl._tcp]
        NSBluetoothAlwaysUsageDescription: "Connect to your computer over Bluetooth when Wi-Fi is off or unavailable."
        ITSAppUsesNonExemptEncryption: false   # standard encryption only; see docs/RELEASE.md before App Store submission
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ninecontroller.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
  Controller9UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Controller9
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.ninecontroller.ios.uitests
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Controller9:
    build:
      targets:
        Controller9: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [Controller9UITests]
