[workspace]
resolver = "3"
members = [
    "protocol/rust",
    "hosts/core",
    "hosts/linux",
    "hosts/macos",
    "hosts/windows",
    "hosts/cli",
    "hosts/app/src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
nine-proto = { path = "protocol/rust" }
nine-host-core = { path = "hosts/core" }
nine-pad-linux = { path = "hosts/linux" }
nine-pad-macos = { path = "hosts/macos" }
nine-pad-windows = { path = "hosts/windows" }
chacha20poly1305 = "=0.11.0"
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }
hmac = "=0.13.0"
sha2 = "=0.11.1"
getrandom = "=0.4.3"
subtle = "=2.6.1"
zeroize = "=1.9.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.23.1"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["net", "rt-multi-thread", "macros", "time", "sync", "io-util"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
mdns-sd = "=0.21.5"
parking_lot = "=0.12.5"
directories = "=6.0.0"
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
libc = "=0.2.191"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
