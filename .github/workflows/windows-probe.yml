# Fast Windows iteration: reuses controller9.exe from an earlier installers run (no 40-minute build)
# and runs the ViGEmBus game-visible test plus driver diagnostics.
name: windows-probe
on:
  workflow_dispatch:
    inputs:
      run_id: { description: "installers run whose windows-x64 artifact has controller9.exe", required: true }
      xusb: { description: "install Microsoft's Xbox 360 (xusb22) driver first: yes/no", default: "no" }
permissions: { contents: read, actions: read }
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: windows-x64, path: art, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}" }
      - name: Diagnose and run the game-visible test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force evidence | Out-Null
          $B = (Get-ChildItem art -Recurse -Filter controller9.exe | Select-Object -First 1).FullName
          (Get-CimInstance Win32_OperatingSystem).Caption | Tee-Object evidence/result.txt
          "xusb in driver store:" | Tee-Object -Append evidence/result.txt
          Get-ChildItem C:\Windows\System32\DriverStore\FileRepository -Directory -Filter "xusb*" | ForEach-Object Name | Tee-Object -Append evidence/result.txt
          Get-ChildItem C:\Windows\INF -Filter "xusb*.inf" | ForEach-Object Name | Tee-Object -Append evidence/result.txt
          & $B install-driver | Tee-Object evidence/install-driver.json
          & $B status | Tee-Object evidence/status.json
          $h = Start-Process $B -ArgumentList "host --ephemeral --pair --auto-approve --no-advertise --no-ble" -RedirectStandardOutput evidence/host.log -RedirectStandardError evidence/host.err -PassThru
          Start-Sleep -Seconds 3
          python -m pip install --quiet pysdl2==0.9.17 pysdl2-dll==2.32.10
          $x = Start-Process python -ArgumentList "tools/windows-check/xinputcheck.py 16 5" -RedirectStandardOutput evidence/xinput.jsonl -RedirectStandardError evidence/xinput.err -PassThru
          $sd = Start-Process python -ArgumentList "tools/windows-check/sdlcheck.py 16" -RedirectStandardOutput evidence/sdl.jsonl -RedirectStandardError evidence/sdl.err -PassThru
          Start-Sleep -Milliseconds 500
          & $B sim --host 127.0.0.1:47901 --code --pattern sweep --duration 10.2 --json > evidence/sim.json 2> evidence/sim.err
          Get-PnpDevice -PresentOnly | Where-Object { $_.FriendlyName -match "Xbox|XUSB|Virtual Gamepad|Game|HID-compliant game" } | Format-List FriendlyName,Status,Problem,Class,InstanceId | Out-File evidence/pnp.txt
          Get-PnpDevice | Where-Object { $_.Status -ne "OK" } | Format-List FriendlyName,Status,Problem,Class,InstanceId | Out-File evidence/pnp-problems.txt
          $x.WaitForExit(); $sd.WaitForExit(); Stop-Process -Id $h.Id -Force
          python tools/windows-check/verify.py evidence
          if ($LASTEXITCODE -ne 0) { throw "game-visible check failed" }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: probe-evidence, path: evidence/ }
