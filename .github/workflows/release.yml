# Release builds. Every job builds on a native runner and signs ONLY with CI secrets; without the
# secrets a job produces clearly-labelled UNSIGNED development artifacts that must not be published.
# STATUS: written, never run (no remote repository, no signing material configured).
name: release
on:
  push: { tags: ["v*"] }
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  android:
    runs-on: ubuntu-24.04
    # `secrets` cannot be used in `if:`; map them into env and test env instead.
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
      - name: Restore release keystore from secrets
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > apps/android/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "${{ secrets.ANDROID_STORE_PASSWORD }}" "${{ secrets.ANDROID_KEY_ALIAS }}" "${{ secrets.ANDROID_KEY_PASSWORD }}" > apps/android/keystore.properties
      - run: cd apps/android && ./gradlew :app:assembleRelease :app:bundleRelease
      - run: tools/release/checksums.sh apps/android/app/build/outputs
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            apps/android/app/build/outputs/**/*.apk
            apps/android/app/build/outputs/**/*.aab
            apps/android/app/build/outputs/SHA256SUMS
  desktop:
    strategy:
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Build (signing via APPLE_* / TAURI_SIGNING_* / Windows cert secrets when present)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cd hosts/app/src-tauri && cargo tauri build --target ${{ matrix.target }}
      - run: tools/release/checksums.sh target/${{ matrix.target }}/release/bundle
      - uses: actions/upload-artifact@v4
        with: { name: "desktop-${{ matrix.target }}", path: "target/${{ matrix.target }}/release/bundle" }
  windows-driver:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      # The WDK must match the installed Windows SDK; installation step to be validated on the runner.
      - run: winget install --id Microsoft.WindowsWDK.10.0.26100 --accept-package-agreements --accept-source-agreements
      - run: msbuild hosts/windows/driver/NineVhf/NineVhf.vcxproj /p:Configuration=Release /p:Platform=x64
      # Production: submit the CAB to Microsoft Partner Center for attestation signing (manual, EV certificate).
      - uses: actions/upload-artifact@v4
        with: { name: windows-driver-unsigned, path: hosts/windows/driver/NineVhf/x64/Release }
  ios:
    runs-on: macos-15
    # Enable by setting the repository variable IOS_RELEASE=true once signing secrets exist.
    if: vars.IOS_RELEASE == 'true'
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && cd apps/ios && xcodegen generate
      - env: { APPLE_TEAM_ID: "${{ secrets.APPLE_TEAM_ID }}" }
        run: |
          cd apps/ios
          xcodebuild -project Controller9.xcodeproj -scheme Controller9 -destination 'generic/platform=iOS' \
            -configuration Release DEVELOPMENT_TEAM="$APPLE_TEAM_ID" -allowProvisioningUpdates \
            archive -archivePath build/Controller9.xcarchive
      # Upload to TestFlight with App Store Connect API key secrets (xcrun altool / notarytool) — to be configured.
