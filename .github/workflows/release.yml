# Release builds. Every job builds on a native runner and signs ONLY with CI secrets; without the
# secrets a job produces clearly-labelled UNSIGNED development artifacts that must not be published.
name: release
on:
  push: { tags: ["v*"] }
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  android:
    runs-on: ubuntu-24.04
    # `secrets` cannot be used in `if:`; map them into env and test env instead.
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
      - name: Restore release keystore from secrets
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > apps/android/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "${{ secrets.ANDROID_STORE_PASSWORD }}" "${{ secrets.ANDROID_KEY_ALIAS }}" "${{ secrets.ANDROID_KEY_PASSWORD }}" > apps/android/keystore.properties
      - run: cd apps/android && ./gradlew :app:assembleRelease :app:bundleRelease
      - run: tools/release/checksums.sh apps/android/app/build/outputs
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            apps/android/app/build/outputs/**/*.apk
            apps/android/app/build/outputs/**/*.aab
            apps/android/app/build/outputs/SHA256SUMS
