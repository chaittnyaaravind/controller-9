# Validates the winget manifests and installs from them on a clean Windows runner — the same thing
# the winget-pkgs PR pipeline does — before anything is submitted. Manifests: tools/stores/winget.sh.
name: winget
on:
  workflow_dispatch:
    inputs:
      version: { description: "packaging/winget/<version>", required: true }
permissions: { contents: read }
jobs:
  validate-and-install:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate, install (with the ViGEmBus dependency), check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $m = "packaging/winget/${{ inputs.version }}"
          New-Item -ItemType Directory -Force evidence | Out-Null
          winget --version | Tee-Object evidence/result.txt
          winget settings --enable LocalManifestFiles
          winget validate --manifest $m | Tee-Object -Append evidence/result.txt
          if ($LASTEXITCODE -ne 0) { throw "manifest invalid" }
          winget install --manifest $m --accept-package-agreements --accept-source-agreements --silent --disable-interactivity | Tee-Object -Append evidence/result.txt
          if ($LASTEXITCODE -ne 0) { throw "install failed ($LASTEXITCODE)" }
          $exe = Get-ChildItem "C:\Program Files\Controller-9" -Filter *.exe -Recurse | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          if ($exe -eq $null) { throw "app not installed" }
          "installed: $($exe.FullName)" | Tee-Object -Append evidence/result.txt
          $drv = Get-PnpDevice -FriendlyName "*Virtual Gamepad Emulation Bus*" -ErrorAction SilentlyContinue
          if ($drv -eq $null) { throw "ViGEmBus dependency not installed" }
          "ViGEmBus: $($drv.Status)" | Tee-Object -Append evidence/result.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: winget-evidence, path: evidence/ }
